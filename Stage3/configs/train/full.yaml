trainer:
  epochs: 30
  batch_size: 256
  num_workers: 0
  device: cpu
  precision: 32
  grad_clip: 1.0
  early_stopping_patience: 7
  early_stopping_metric: val_pr_auc
  monitor_mode: max

optimizer:
  name: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 2
  min_lr: 1.0e-6

loss:
  name: focal
  alpha: 0.25
  gamma: 2.0
  class_weights: auto

reproducibility:
  seed: 42
  deterministic: true
  cudnn_benchmark: false

logging:
  log_dir: experiments/runs
  experiment_name: full
  log_every_n_steps: 100
  save_top_k: 1
  save_last: true

checkpoints:
  dir: models
  filename_template: "{model}_seed{seed}.pt"
