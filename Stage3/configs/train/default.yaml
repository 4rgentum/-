trainer:
  epochs: 50
  batch_size: 256
  num_workers: 4
  device: auto         # auto | cpu | cuda
  precision: 32        # 16 | 32
  grad_clip: 1.0
  early_stopping_patience: 10
  early_stopping_metric: val_pr_auc
  monitor_mode: max

optimizer:
  name: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 3
  min_lr: 1.0e-6

loss:
  name: focal           # bce | focal
  alpha: 0.25
  gamma: 2.0
  class_weights: auto   # auto | null | [w_neg, w_pos]

reproducibility:
  seed: 42
  deterministic: true
  cudnn_benchmark: false

logging:
  log_dir: experiments/runs
  experiment_name: default
  log_every_n_steps: 50
  save_top_k: 3
  save_last: true

checkpoints:
  dir: models
  filename_template: "{model}_{seed}_{val_pr_auc:.4f}.pt"
