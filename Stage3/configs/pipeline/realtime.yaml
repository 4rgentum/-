# Конфигурация realtime-стенда.
# Используется при запуске scripts/07_demo_realtime.py.

inference:
  service_host: 127.0.0.1
  service_port: 8000
  model_checkpoint: models/cnn_lstm_best.pt
  preprocessor_artifact: data/processed/unsw/preprocessor.joblib
  threshold: auto             # auto = из results/tables/threshold.json
  batch_size: 1
  device: cpu

ui:
  host: 127.0.0.1
  port: 8501
  api_url: http://127.0.0.1:8000
  refresh_interval_seconds: 1
  alert_history_size: 1000

attacker:
  enabled: true
  policy: configs/attacker/policy.yaml
  rate_limit_eps: 50          # для воспроизводимого потока

logging:
  alert_log_path: experiments/runs/realtime_alerts.jsonl
  drift_log_path: experiments/runs/realtime_drift.jsonl
