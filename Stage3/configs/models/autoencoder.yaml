name: autoencoder
type: dl_semi_supervised

architecture:
  input_features: 60
  window_size: 32
  encoder_dims: [256, 128, 64, 32]
  decoder_dims: [64, 128, 256]
  dropout: 0.1
  activation: relu

scoring:
  metric: reconstruction_mse
  threshold_quantile: 0.99    # вычисляется на нормальной выборке
