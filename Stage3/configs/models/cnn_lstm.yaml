name: cnn_lstm
type: dl_supervised
proposed: true

architecture:
  input_features: 60
  window_size: 32

  conv_blocks:
    - out_channels: 64
      kernel_size: 3
      padding: same
      activation: relu
      pool_size: 2
      dropout: 0.1
    - out_channels: 128
      kernel_size: 3
      padding: same
      activation: relu
      pool_size: 2
      dropout: 0.1

  lstm:
    hidden_size: 128
    num_layers: 1
    dropout: 0.2
    bidirectional: false

  head:
    type: mlp
    hidden_dims: [128, 64]
    dropout: 0.3
    activation: relu

  output:
    num_classes: 2
    activation: sigmoid
